name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Installs the version pinned in rust-toolchain.toml, with its
      # components, so CI matches local builds exactly.
      - run: rustup toolchain install

      # winit needs X11/Wayland headers on Linux. Mesa's lavapipe is a
      # software Vulkan driver, so headless GPU tests run there too.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev mesa-vulkan-drivers
          echo "REQUIRE_GPU=1" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
