[workspace]
resolver = "3"
members = ["crates/*", "game"]

[workspace.package]
edition = "2024"
version = "0.1.0"
# Internal crates; never published to crates.io.
publish = false

[workspace.dependencies]
base = { path = "crates/base" }
bsp = { path = "crates/bsp" }
physics = { path = "crates/physics" }
platform = { path = "crates/platform" }
level = { path = "crates/level" }
mapfile = { path = "crates/mapfile" }
mapc = { path = "crates/mapc" }
render = { path = "crates/render" }
script = { path = "crates/script" }
engine = { path = "crates/engine" }

anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glam = { version = "0.34.1", features = ["bytemuck"] }
log = "0.4.34"
# Lua 5.4 built from vendored C source, so no system Lua is needed.
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
notify = "8.2.0"
png = "0.18.1"
pollster = "1.0.1"
thiserror = "2.0.21"
wgpu = "30.0.1"
winit = "0.30.13"

# Lints for every crate; each opts in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

# Optimize dependencies in debug builds; keeps wgpu/naga fast while our
# own code stays debuggable. Line tables only for dependencies: backtraces
# still name their files, and target/ shrinks by gigabytes.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"
