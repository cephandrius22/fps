// TrenchBroom game configuration for the engine. Install by linking or
// copying this folder into TrenchBroom's games folder as "RetroFPS"
// (README.md, "Editing maps"), then set the game path to the repository.
{
    "version": 9,
    "name": "RetroFPS",
    "fileformats": [
        { "format": "Valve" },
        { "format": "Standard" }
    ],
    "filesystem": {
        // Relative to the game path: the repository's asset folder.
        "searchpath": "assets",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },
    "materials": {
        // assets/textures/<name>.png, the same files mapc and the engine use.
        "root": "textures",
        "extensions": [ ".png" ]
    },
    "entities": {
        // Generated from crates/entities: cargo run -p entities -- trenchbroom/RetroFPS.fgd
        "definitions": [ "RetroFPS.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [
            {
                "name": "Detail",
                "attribs": [],
                "match": "classname",
                "pattern": "func_detail*"
            },
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger*",
                "material": "trigger"
            }
        ],
        "brushface": [
            {
                "name": "Clip",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "clip"
            },
            {
                "name": "Skip",
                "match": "material",
                "pattern": "skip"
            },
            {
                "name": "Hint",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "hint*"
            },
            {
                "name": "Liquid",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "\**"
            }
        ]
    },
    "softMapBounds": "-4096 -4096 -4096 4096 4096 4096",
    "compilationTools": [
        { "name": "mapc", "description": "Path to the mapc binary (cargo build --release -p mapc: target/release/mapc)" }
    ]
}
